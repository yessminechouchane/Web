<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>addTravelOffer.html</title>
    </head>
    <body>
        <pre>
        <h1>Add a travel offer</h1>
        <label for="title">Title: </label>
        <input type="text" id="title" title="title"   required  minlength="3" maxlength="25" size="40">
        <label for="destination">Destination: </label>
        <input type="text" id="destination" title="destination"   required  minlength="3" maxlength="20"  pattern="[A-Za-z\s]+"  size="40">
        <label for="departure">Departure Date: </label>
        <input type="date" id="departure" name="departure" required>
        <label for="return">Retuen Date: </label>
        <input type="date" id="return" name="return" required>
        <label for="price">Price: </label>
        <input type="number" id="price" name="price"  min="0"  required>
        <label for="availibility">Availibility: </label>
        <input type="checkbox" id="availibility" name="availibility"    checked>
        <label for="category">Category: </label>
        <div>
            <select>
                <option selected value="adventure">Adventure</option>
                <option value="trip">Trip</option>
                
            </select>
        </div>
        <input type="submit" value="Add offer">
        
    </pre>
    </body>
